[project]
name = "esp-killer"
description = "Server-side detection of likely ESP (wallhack) users on The Isle: Evrima servers, from player movement"
version = "0.1.0"
authors = [
    { name = "Floris van Beers" },
]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"

# One project for the whole monorepo. The agent only imports `agent` and `shared`, so PyInstaller never
# bundles the server's numpy/pandas/matplotlib; tests/unit/test_import_boundaries.py enforces that.
dependencies = [
    # agent + shared
    "httpx~=0.28",
    "pydantic~=2.11",
    "pydantic-settings~=2.10",
    "typer~=0.16",
    # server
    "fastapi~=0.136",
    "uvicorn~=0.46",
    "pyyaml~=6.0",
    "numpy~=2.3",
    "pandas~=2.3",
    "matplotlib~=3.10",
    "pyarrow~=25.0",
    "boto3~=1.43",
]

[dependency-groups]
build = [
    "pyinstaller>=6.22.3",
]
dev = [
    "uv>=0.11.11",
    "hypothesis>=6.140",
    "mypy>=2.0.0",
    "pandas-stubs",
    "pre-commit>=4.6.0",
    "pydoclint>=0.8.3",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.12",
    "types-PyYAML",
]

[tool.uv]
# Not an installable package: everything runs from the repo root (`python -m agent`, `server.app:create_app`).
package = false

[tool.ruff]
line-length = 119

[tool.ruff.lint]
select = [
    "ANN",
    "B",
    "C4",
    "C90",
    "D",
    "E",
    "F",
    "G",
    "I",
    "ISC",
    "N",
    "PERF",
    "PL",
    "FURB",
    "SIM",
    "T20",
    "TD",
    "TID252",
    "UP",
]

ignore = [
    "ANN002", "ANN003", "ANN401",
    "D100", "D101", "D104", "D106", "D107", "D202", "D203", "D212", "D301", "D401", "D413",
    "G004",
    "ISC001",
    "TD002", "TD003",
    "PLR0913", "PLR2004"
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/**" = ["D102", "D103", "D105", "PLR2004"]
# Build/release scripts report progress on stdout.
"packaging/**" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["agent", "server", "shared", "tools"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Header",
    "fastapi.Depends",
    "fastapi.Query",
    "typer.Option",
    "typer.Argument",
]

[tool.mypy]
exclude = [".git", ".venv", ".claude"]
ignore_missing_imports = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
strict_equality = true
plugins = ["pydantic.mypy"]

[tool.pydoclint]
style = "sphinx"
allow-init-docstring = true
require-return-section-when-returning-nothing = false
check-return-types = false
check-yield-types = false
check-style-mismatch = true
arg-type-hints-in-docstring = false
should-document-star-arguments = false
skip-checking-short-docstrings = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = [
    "--cov=agent",
    "--cov=server",
    "--cov=shared",
    "--cov=tools",
    "--strict-markers",
    "--cov-report=term",
    "--cov-report=xml",
]

[tool.coverage.report]
skip_covered = true
exclude_also = [
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
